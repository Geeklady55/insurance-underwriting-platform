<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insurance Underwriting Form</title>
  <p><strong>Note:</strong> This GitHub Pages site hosts the frontend demo only. The FastAPI backend must be run locally or deployed separately for live API submission.</p>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 16px;
      line-height: 1.5;
    }
    form {
      border: 1px solid #ddd;
      padding: 20px;
      border-radius: 10px;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      margin-bottom: 16px;
      box-sizing: border-box;
    }
    button {
      cursor: pointer;
    }
    pre {
      background: #f5f5f5;
      padding: 16px;
      border-radius: 10px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>Insurance Application</h1>
  <p>Submit an application and receive an underwriting decision.</p>

  <form id="appForm">
    <label for="full_name">Full Name</label>
    <input type="text" id="full_name" required>

    <label for="age">Age</label>
    <input type="number" id="age" required>

    <label for="smoker">Smoker (yes/no)</label>
    <input type="text" id="smoker" required>

    <label for="annual_income">Annual Income</label>
    <input type="number" id="annual_income" required>

    <label for="coverage_amount">Coverage Amount</label>
    <input type="number" id="coverage_amount" required>

    <button type="submit">Submit Application</button>
  </form>

  <h2>Result</h2>
  <pre id="result">No submission yet.</pre>
<script>
  const API_BASE_URL = "http://127.0.0.1:8000";

  document.getElementById("appForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const payload = {
      full_name: document.getElementById("full_name").value,
      age: parseInt(document.getElementById("age").value),
      smoker: document.getElementById("smoker").value,
      annual_income: parseFloat(document.getElementById("annual_income").value),
      coverage_amount: parseFloat(document.getElementById("coverage_amount").value)
    };

    try {
      const response = await fetch(`${API_BASE_URL}/applications`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        throw new Error("API request failed");
      }

      const data = await response.json();
      document.getElementById("result").textContent = JSON.stringify(data, null, 2);
    } catch (error) {
      document.getElementById("result").textContent =
        "Live site note: this frontend is hosted on GitHub Pages, but the FastAPI backend must be running locally or deployed separately. To test the full workflow locally, start the backend with 'uvicorn app.main:app --reload' and open http://127.0.0.1:8000/docs.";
    }
  });
</script>

 
</body>
</html>
